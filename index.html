<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Trilha Rosa · Jogo Clássico ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="board-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>
            
            <div class="info-area">
                <div class="players-info">
                    <div class="player-card player1-card" id="player1Card">
                        <div class="player-icon">🌸</div>
                        <div class="player-name">Jogador 1</div>
                        <div class="player-pieces" id="player1Pieces">0 / 9</div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="player-card player2-card" id="player2Card">
                        <div class="player-icon">💖</div>
                        <div class="player-name">Jogador 2</div>
                        <div class="player-pieces" id="player2Pieces">0 / 9</div>
                    </div>
                </div>
                
                <div class="game-status" id="gameStatus">
                    <div class="status-icon">🎲</div>
                    <div class="status-text">Fase de Posicionamento</div>
                </div>
                
                <div class="turn-indicator" id="turnIndicator">
                    <span class="turn-label">Vez de:</span>
                    <span class="turn-player" id="turnPlayer">Jogador 1</span>
                    <span class="turn-piece" id="turnPiece">🌸</span>
                </div>
                
                <button class="reset-btn" id="resetButton">
                    <span>🔄</span> Novo Jogo
                </button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
